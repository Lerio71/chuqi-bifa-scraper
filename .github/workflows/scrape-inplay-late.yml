# 比赛中高频采集 — 深夜时段（欧洲联赛主要比赛时间）
# 北京时间 01:00-06:00 = UTC 17:00-22:00（前一天）
# 每10分钟采集一次（GitHub Actions cron 最小间隔）
#
# 注意: GitHub Actions cron 调度可能有 5-15 分钟延迟，属正常现象

name: 比赛中-深夜

on:
  schedule:
    # 北京 01:00-05:50 每10分钟 = UTC 17:00-21:50
    - cron: '*/10 17-21 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集快照
        run: python run.py --label inplay

      - name: 提交数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: inplay $(date -u +%Y-%m-%dT%H:%M)" && git push)
