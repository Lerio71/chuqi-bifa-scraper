# 动态窗口采集 — 足彩14场（每场按各自开赛时间分流）
# 取代原"固定时点"的 scrape-pre-match.yml / scrape-inplay-*.yml
# 逻辑：云端每 15 分钟触发一次，脚本内部针对【每一场比赛自己的开赛时间】
#       计算"距开赛剩余时间"，自动落入 pre_24h~pre_15min / inplay 对应窗口。
#       14 场开赛时间各不相同（凌晨 00:30~03:30），互不干扰、自动覆盖。
# 跨期：master_sync.py --auto 自动识别当期期号（type=1 未开奖期），
#       期号变化自动跟随并记录到 state/current.json，无需每期手动改。
# 已开赛自动跳过、已结束自动不采，省调用。
#
# cron 用 UTC：每 15 分钟 = */15 * * * *

name: 动态窗口采集

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dynamic-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 同步当期14场ID（自动识别期号）
        run: python master_sync.py --auto --write

      - name: 动态窗口采集（每场按开赛时间分流）
        run: python run.py

      - name: 提交数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ matches.json state/
          git diff --cached --quiet || (git commit -m "data: dynamic $(date -u +%Y-%m-%dT%H:%M)" && git push)
