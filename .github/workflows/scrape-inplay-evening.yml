# 比赛中高频采集 — 傍晚时段（部分早场欧洲比赛 + 亚洲比赛）
# 北京时间 18:00-23:00 = UTC 10:00-15:00
# 每10分钟采集一次

name: 比赛中-傍晚

on:
  schedule:
    # 北京 18:00-22:50 每10分钟 = UTC 10:00-14:50
    - cron: '*/10 10-14 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集快照
        run: python run.py --label inplay

      - name: 提交数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: inplay $(date -u +%Y-%m-%dT%H:%M)" && git push)
