# 赛后快照 + 每日汇总报告
# 北京时间 06:00 赛后采集，06:10 生成日报

name: 赛后与日报

on:
  schedule:
    # 北京 06:00 = UTC 22:00 — 赛后快照
    - cron: '0 22 * * *'
    # 北京 06:10 = UTC 22:10 — 生成日报
    - cron: '10 22 * * *'
  workflow_dispatch:

jobs:
  scrape-or-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 判断任务类型
        id: task
        run: |
          UTC_MIN=$(date -u +%M)
          if [ "$UTC_MIN" = "10" ]; then
            echo "type=report" >> $GITHUB_OUTPUT
          else
            echo "type=post" >> $GITHUB_OUTPUT
          fi

      - name: 赛后快照
        if: steps.task.outputs.type == 'post'
        run: python run.py --label post

      - name: 生成日报
        if: steps.task.outputs.type == 'report'
        run: python run.py --report

      - name: 提交数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: ${{ steps.task.outputs.type }} $(date -u +%Y-%m-%dT%H:%M)" && git push)
