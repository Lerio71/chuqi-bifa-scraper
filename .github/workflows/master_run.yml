name: Master Run 足彩必发指数动态采集 v2.1

on:
  workflow_dispatch:
  schedule:
    # UTC时间，北京时间=UTC+8
    # 每2小时运行一次，脚本内部按每场开赛时间自动判断采集窗口
    - cron: '0 */2 * * *'

jobs:
  dynamic_scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 同步当期足彩14场比赛信息
        run: python master_sync.py --auto --write
        env:
          REQUEST_TIMEOUT: "40"

      - name: 按每场开赛时间动态采集必发指数
        run: python run.py
        env:
          REQUEST_TIMEOUT: "30"

      - name: 保存采集结果工件
        uses: actions/upload-artifact@v4
        with:
          name: bifa-snapshot-output
          path: |
            ./data/**/*.json
            ./matches.json
          retention-days: 30

      - name: 打印运行结束提示
        run: echo "动态采集流水线执行完毕，结果已保存为工件"
